name: Lint Code

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lint dependencies
        run: python -m pip install -r .github/lint/requirements.txt
      - name: Run Linter
        run: git ls-files -z -- '*.py' | xargs -0 --no-run-if-empty python -m flake8
      - name: Run offline Python regressions
        run: python -m unittest discover -s tests -v

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned lint dependencies
        run: npm ci --prefix .github/lint --ignore-scripts --no-audit --no-fund
      - name: Run Linter
        run: >-
          git ls-files -z -- 'server/database/*.js' 'server/database/*.cjs' |
          xargs -0 --no-run-if-empty .github/lint/node_modules/.bin/jshint
          --config server/database/.jshintrc
